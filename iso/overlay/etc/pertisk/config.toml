# Appliance defaults. First boot rewrites listen / firmware / node_name from hostname.

[daemon]
listen = "0.0.0.0:7480"
tls_listen = "0.0.0.0:7443"

[vmm]
# qemu = serial + VNC (Proxmox-like). cloud-hypervisor = serial only.
driver = "qemu"
run_dir = "/var/lib/pertisk/run"
cloud_hypervisor = "/usr/bin/cloud-hypervisor"
firmware = "/usr/lib/cloud-hypervisor/hypervisor-fw"

[storage]
root = "/var/lib/pertisk/storage"
# replica = local files on this node. HA restart requires a Ceph RBD volume.
# rbd = host default for new volumes (needs the rbd CLI and a Ceph pool).
backend = "replica"
replica_count = 1
qemu_img = "/usr/bin/qemu-img"

[network]
apply_host_links = true

[cluster]
name = "pertisk"
