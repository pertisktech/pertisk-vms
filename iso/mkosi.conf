[Config]
MinimumVersion=25

[Distribution]
Distribution=debian
Release=trixie
# Realtek/Intel 2.5G NIC firmware (GMKtec G11 and similar mini PCs).
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
OutputDirectory=../out
ImageId=pertisk-node

[Content]
Bootable=yes
# We stage BOOTX64.EFI + vmlinuz on the ESP ourselves (pertisk-esp-boot).
# mkosi GRUB/UKI is what hung GMKtec AMI at "EFI stub" / "grub>".
Bootloader=none
UnifiedKernelImages=no
KernelCommandLine=console=tty0 console=ttyS0
Hostname=pertisk
RootPassword=pertisk
ExtraTrees=overlay:/
Packages=systemd
         systemd-sysv
         apt
         iproute2
         iptables
         qemu-utils
         openssh-server
         parted
         gdisk
         dosfstools
         e2fsprogs
         curl
         rsync
         sudo
         ca-certificates
         dbus
         systemd-resolved
         initramfs-tools
         firmware-realtek
         firmware-misc-nonfree
         isc-dhcp-client
         git
         zsh
         zsh-autosuggestions
         zsh-syntax-highlighting
         fonts-powerline
         iputils-ping

[Build]
WithNetwork=yes
