[Config]
MinimumVersion=25

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
OutputDirectory=../out
ImageId=pertisk-node

[Content]
Bootable=yes
# We stage BOOTX64.EFI + vmlinuz on the ESP ourselves (pertisk-esp-boot).
# mkosi GRUB/UKI is what hung GMKtec AMI at "EFI stub" / "grub>".
Bootloader=none
UnifiedKernelImages=no
KernelCommandLine=console=tty0 console=ttyS0
Hostname=pertisk
RootPassword=pertisk
ExtraTrees=overlay:/
Packages=systemd
         systemd-sysv
         iproute2
         iptables
         qemu-utils
         openssh-server
         parted
         gdisk
         dosfstools
         e2fsprogs
         curl
         rsync
         sudo
         ca-certificates
         dbus
         initramfs-tools

[Build]
WithNetwork=yes
