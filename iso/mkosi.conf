[Config]
MinimumVersion=25

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
OutputDirectory=../out
ImageId=pertisk-node

[Content]
Bootable=yes
Bootloader=grub
# Type 1 GRUB (vmlinuz+initrd). UKI/EFI stub hangs on many AMI mini-PC firmwares (GMKtec G11).
# mkosi 25 treats this as a boolean (no/yes); later mkosi uses none/unsigned/signed.
UnifiedKernelImages=no
KernelCommandLine=console=tty0 console=ttyS0
Hostname=pertisk
RootPassword=pertisk
ExtraTrees=overlay:/
Packages=systemd
         systemd-sysv
         iproute2
         iptables
         qemu-utils
         openssh-server
         parted
         gdisk
         dosfstools
         e2fsprogs
         curl
         rsync
         sudo
         ca-certificates
         dbus

[Build]
WithNetwork=yes
