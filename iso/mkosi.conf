[Config]
MinimumVersion=25

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
OutputDirectory=../out
ImageId=pertisk-node

[Content]
Bootable=yes
Bootloader=grub
KernelCommandLine=console=ttyS0
Hostname=pertisk
RootPassword=pertisk
ExtraTrees=overlay:/
Packages=systemd
         systemd-sysv
         iproute2
         iptables
         qemu-utils
         openssh-server
         parted
         gdisk
         dosfstools
         e2fsprogs
         curl
         rsync
         sudo
         ca-certificates
         dbus

[Build]
WithNetwork=yes
