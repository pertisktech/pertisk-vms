<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Purple Virtualization Console</title>
  
  <!-- 1. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. xterm.js CSS & JS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

  <!-- 3. Tailwind Custom Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              // Dark Mode Theme Palette
              darkBg: '#0B0713',
              darkCard: '#150E24',
              darkBorder: '#281A43',
              accent: '#A855F7',
              
              // Light Mode Theme Palette
              lightBg: '#F8F5FC',
              lightCard: '#FFFFFF',
              lightBorder: '#E9D5FF',
              lightText: '#2A1B40',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Neon Glow Utilities */
    .glow-purple {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
    }
    .glow-purple-lg {
      box-shadow: 0 0 35px rgba(192, 132, 252, 0.35);
    }
    /* Soft Elevation for Light Mode */
    .light-shadow {
      box-shadow: 0 10px 30px rgba(112, 26, 117, 0.06);
    }
  </style>
</head>
<body class="bg-brand-lightBg dark:bg-brand-darkBg text-brand-lightText dark:text-purple-100 min-h-screen p-4 md:p-8 font-sans antialiased transition-colors duration-300">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header & Theme Toggle -->
    <header class="flex items-center justify-between bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder rounded-2xl p-5 light-shadow dark:glow-purple transition-all">
      <div class="flex items-center space-x-4">
        <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-purple-500/30">
          Hypervisor
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Ouroboros Console</h1>
          <p class="text-xs text-purple-600/70 dark:text-purple-400/70">Virtualization Infrastructure</p>
        </div>
      </div>

      <!-- Theme Switcher Button -->
      <button id="themeToggleBtn" onclick="toggleTheme()" class="flex items-center space-x-2 bg-purple-100 dark:bg-brand-darkBorder hover:bg-purple-200 dark:hover:bg-purple-900/40 text-purple-900 dark:text-purple-200 text-xs px-4 py-2 rounded-xl border border-purple-300 dark:border-purple-500/30 transition-all">
        <span id="themeBtnText">🌙 Dark Mode</span>
      </button>
    </header>

    <!-- Bento Grid Metrics -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Metric 1: CPU -->
      <div class="bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder rounded-2xl p-5 light-shadow dark:glow-purple">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-semibold text-purple-600 dark:text-purple-400">CPU LOAD</span>
          <span class="text-xs bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded-full font-mono">12% Normal</span>
        </div>
        <div class="text-2xl font-bold font-mono">2.40 GHz</div>
        <div class="w-full bg-purple-100 dark:bg-brand-darkBorder rounded-full h-2 mt-4 overflow-hidden">
          <div class="bg-purple-600 dark:bg-brand-accent h-2 rounded-full" style="width: 28%"></div>
        </div>
      </div>

      <!-- Metric 2: Memory -->
      <div class="bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder rounded-2xl p-5 light-shadow dark:glow-purple">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-semibold text-purple-600 dark:text-purple-400">RAM ALLOCATION</span>
          <span class="text-xs font-mono text-purple-500">32 GB / 64 GB</span>
        </div>
        <div class="text-2xl font-bold font-mono">50.0 %</div>
        <div class="w-full bg-purple-100 dark:bg-brand-darkBorder rounded-full h-2 mt-4 overflow-hidden">
          <div class="bg-purple-600 dark:bg-brand-accent h-2 rounded-full" style="width: 50%"></div>
        </div>
      </div>

      <!-- Metric 3: Active VMs -->
      <div class="bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder rounded-2xl p-5 light-shadow dark:glow-purple">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-semibold text-purple-600 dark:text-purple-400">VIRTUAL MACHINES</span>
          <span class="flex items-center space-x-1">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
            <span class="text-xs text-emerald-500 font-mono">8 Running</span>
          </span>
        </div>
        <div class="text-2xl font-bold font-mono">8 / 10 Active</div>
        <div class="w-full bg-purple-100 dark:bg-brand-darkBorder rounded-full h-2 mt-4 overflow-hidden">
          <div class="bg-emerald-500 h-2 rounded-full" style="width: 80%"></div>
        </div>
      </div>

    </div>

    <!-- Main Terminal Console Window -->
    <div class="bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder rounded-2xl light-shadow dark:glow-purple-lg overflow-hidden transition-all">
      
      <!-- Terminal Window Bar -->
      <div class="bg-purple-100/50 dark:bg-[#100B1B] px-5 py-3 border-b border-brand-lightBorder dark:border-brand-darkBorder flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="flex space-x-1.5">
            <span class="w-3 h-3 rounded-full bg-rose-500/80 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
          </div>
          <span class="text-xs font-mono font-medium text-purple-900 dark:text-purple-300">web-server-01 ~ SSH Terminal</span>
        </div>
        <span class="text-[10px] font-mono bg-purple-200 dark:bg-brand-darkBorder text-purple-800 dark:text-purple-300 px-2 py-0.5 rounded">xterm.js</span>
      </div>

      <!-- xterm.js Target Container -->
      <div id="terminal" class="p-4"></div>

    </div>

  </div>

  <!-- JavaScript Setup -->
  <script>
    // 1. Terminal Color Themes
    const darkPurpleTheme = {
      background: '#150E24',
      foreground: '#E2D9F3',
      cursor: '#C084FC',
      cursorAccent: '#150E24',
      selectionBackground: '#3B1E54',
      black: '#0B0713',
      red: '#F43F5E',
      green: '#10B981',
      yellow: '#F59E0B',
      blue: '#818CF8',
      magenta: '#C084FC',
      cyan: '#22D3EE',
      white: '#F3E8FF'
    };

    const lightPurpleTheme = {
      background: '#FFFFFF',
      foreground: '#2A1B40',
      cursor: '#7E22CE',
      cursorAccent: '#FFFFFF',
      selectionBackground: '#E9D5FF',
      black: '#1A102F',
      red: '#E11D48',
      green: '#047857',
      yellow: '#D97706',
      blue: '#4338CA',
      magenta: '#6B21A8',
      cyan: '#0E7490',
      white: '#F8F5FC'
    };

    // 2. Initialize xterm.js
    const term = new Terminal({
      theme: darkPurpleTheme,
      fontFamily: 'Fira Code, JetBrains Mono, monospace',
      fontSize: 13,
      lineHeight: 1.2,
      cursorBlink: true,
      convertEol: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Auto fit on window resize
    window.addEventListener('resize', () => fitAddon.fit());

    // Print Initial Terminal Output
    function printTerminalWelcome() {
      term.clear();
      term.writeln('\x1b[1;35m====================================================\x1b[0m');
      term.writeln('\x1b[1;35m   Ouroboros Deep Purple Hypervisor Terminal        \x1b[0m');
      term.writeln('\x1b[1;35m====================================================\x1b[0m');
      term.writeln('Connecting to \x1b[1;32mweb-server-01.local\x1b[0m via WebSocket...');
      term.writeln('Status: \x1b[32mCONNECTED\x1b[0m | Node: \x1b[33mcluster-node-01\x1b[0m');
      term.write('\r\n\x1b[1;35mroot@web-server-01\x1b[0m:\x1b[1;34m~\x1b[0m# ');
    }
    printTerminalWelcome();

    // 3. Theme Toggle Logic
    let isDark = true;
    function toggleTheme() {
      isDark = !isDark;
      const html = document.documentElement;
      const btnText = document.getElementById('themeBtnText');

      if (isDark) {
        html.classList.add('dark');
        btnText.innerText = '🌙 Dark Mode';
        term.options.theme = darkPurpleTheme;
      } else {
        html.classList.remove('dark');
        btnText.innerText = '☀️ Light Mode';
        term.options.theme = lightPurpleTheme;
      }
      printTerminalWelcome();
    }
  </script>
</body>
</html>
