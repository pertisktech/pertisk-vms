# AlmaLinux nodes use NetworkManager keyfiles (Anaconda + br0).
[main]
# Do not force ifcfg-rh — Alma 10 / RHEL 10 default is keyfile.

[device]
wifi.scan-rand-mac-address=no

[connection]
# Retry DHCP when the lease or carrier is late after boot.
ipv4.dhcp-timeout=60
connection.autoconnect-retries=-1
