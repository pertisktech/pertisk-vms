# tmux.conf for the Pertisk installer environment.
# The main window is the Pertisk web installer. Anaconda starts only after
# the operator confirms, or immediately for rescue / pertisk.autodisk.

bind -n M-tab next
bind -n F1 list-keys

set-option -s exit-unattached off
set-option -g base-index 1

if-shell '[ $(printf "$(tmux -V | cut -d" " -f2)\n2.4" | sort -Vr | head -n1) == $(tmux -V | cut -d" " -f2) ]' \
    'set-option -g remain-on-exit on' \
    'set-option -g set-remain-on-exit on'

set-option -g history-limit 10000

new-session -d -s anaconda -n main /usr/sbin/pertisk-install-ui

set-option status-right '#[fg=blue]#(echo -n "Switch tab: Alt+Tab | Help: F1 ")'

new-window -d -n shell          "bash --login"
new-window -d -n log            "tail -F /tmp/pertisk-install-ui.log"
new-window -d -n storage-log    "tail -F /tmp/storage.log"
new-window -d -n program-log    "tail -F /tmp/program.log"
new-window -d -n packaging-log  "tail -F /tmp/packaging.log"
