# Generated on first pertiskd start at $PERTISK_HOME/config.toml (~/.pertisk).
# Bootstrap admin password: env PERTISK_ADMIN_PASSWORD (default: admin).

[daemon]
listen = "127.0.0.1:7480"
# HTTPS for the UI/API (HTTP/1.1 + HTTP/2). Self-signed certs are created on first start.
# tls_listen = "0.0.0.0:7443"
# tls_cert = "tls/cert.pem"
# tls_key = "tls/key.pem"
# Set tls_listen = "off" to disable HTTPS.
# host_power_cmd = "skip"  # log only; default is systemctl poweroff|reboot

[vmm]
# mock | cloud-hypervisor | qemu
# macOS defaults to mock (no /dev/kvm). Linux defaults to qemu (serial + VNC).
driver = "mock"
run_dir = "/tmp/pertisk-run"
# cloud_hypervisor = "/usr/bin/cloud-hypervisor"
# Disk/ISO boot for cloud-hypervisor: rust-hypervisor-firmware (hypervisor-fw)
# firmware = "/usr/lib/cloud-hypervisor/hypervisor-fw"
# QEMU uses OVMF from the ovmf package when present.

[storage]
root = "storage"
# qemu_img = "/usr/local/bin/qemu-img"
# replica = lab file copies (HA restart is not crash-safe)
# rbd = Ceph RBD — recommended for production HA when the `rbd` CLI is installed
backend = "replica"
replica_count = 2
# rbd_pool = "rbd"

[network]
# Linux: create bridges/TAPs with `ip`. macOS stays inventory-only.
apply_host_links = false

[cluster]
name = "pertisk"
# node_name = "node-1"
# peer_url = "http://192.168.1.10:7480"
# join = "http://192.168.1.10:7480"
heartbeat_ms = 1000
offline_after_ms = 20000     # 2-node clusters need headroom; 5s fences too easily
# Auto-detected from nproc / MemTotal if unset (16c/64G → 16 / ~48GiB advertised).
# cpus = 16
# memory_mib = 49152

# Shared SMTP notifications (Datacenter → Settings). Password is stored in config.toml.
[notify]
enabled = false
smtp_host = ""
smtp_port = 587
smtp_tls = "starttls"   # off | starttls | tls
smtp_user = ""
smtp_password = ""
from = "pertisk@example.com"
recipients = ["ops@example.com"]
events = ["vm.destroy", "vm.failed", "task.error", "node.offline"]
# Also available: "vm.create", "vm.start", "vm.stop"
