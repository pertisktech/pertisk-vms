# Generated on first pertiskd start at $PERTISK_HOME/config.toml (~/.pertisk).
# Bootstrap admin password: env PERTISK_ADMIN_PASSWORD (default: admin).

[daemon]
listen = "127.0.0.1:7480"

[vmm]
# mock | cloud-hypervisor
# macOS defaults to mock (no /dev/kvm). Linux defaults to cloud-hypervisor.
driver = "mock"
run_dir = "/tmp/pertisk-run"
# cloud_hypervisor = "/usr/bin/cloud-hypervisor"
# Disk/ISO boot: rust-hypervisor-firmware binary (hypervisor-fw)
# firmware = "/usr/lib/cloud-hypervisor/hypervisor-fw"

[storage]
root = "storage"
# qemu_img = "/usr/local/bin/qemu-img"
# replica = replicated files across cluster nodes (default)
# rbd = Ceph RBD when the `rbd` CLI is installed
backend = "replica"
replica_count = 2
# rbd_pool = "rbd"

[network]
# Linux: create bridges/TAPs with `ip`. macOS stays inventory-only.
apply_host_links = false

[cluster]
name = "pertisk"
# node_name = "node-1"
# peer_url = "http://192.168.1.10:7480"
# join = "http://192.168.1.10:7480"
heartbeat_ms = 1000
offline_after_ms = 5000
# Auto-detected from nproc / MemTotal if unset (16c/64G → 16 / ~48GiB advertised).
# cpus = 16
# memory_mib = 49152
